# xemu for Xbox Dev Mode, rebuilt for the Xbox One S.
#
# The released Xemu_0.9.208.0_x64.appx is compiled for x86-64-v3 (-Dx86_version=3: BMI2, FMA3, AVX2). The
# One S CPU is an AMD Jaguar (GCC btver2: SSE4.2, AVX, BMI1, F16C, MOVBE) and stops the app at the first BMI2
# instruction with STATUS_ILLEGAL_INSTRUCTION. This job rebuilds only xemu.exe, for btver2 at x86-64-v2, and
# puts it back into the released package with matching MinGW DLLs. Nothing in the emulator's source changes.
#
# Mesa: the released package's libgallium_wgl.dll and opengl32.dll emit DXIL, which the One S D3D12 driver
# refuses (xemu died at its first draw). This branch replaces them with the lopezjon45-web/mesa-uwp build that
# carries the nir_to_dxbc backend (DXBC shader model 5.1 when the adapter reports no SM 6.0), published as a
# release of that repository so no cross-repository token is needed. The release holds the ISA gate reports
# of that build; the step below refuses a DLL whose report is missing or not clean.
name: uwp-one-s

on:
  workflow_dispatch:
  push:
    branches: [uwp-one-s-dxbc]

permissions:
  contents: read

env:
  START_COMMIT: e4b6fd5d96dadf3b469d376e33fce1b562c8225a # skitzellez/xemu-uwp branch uwp, where this branch starts
  APPX_URL: https://github.com/skitzellez/xemu-uwp/releases/download/uwp-0.9.208.0/Xemu_0.9.208.0_x64.appx
  APPX_SHA256: b4ef6b260a852b7f4d1660002475bfd65e6ed094ea454daea0b1a888cb51fe98
  LIBSMB2_SRC_URL: https://github.com/skitzellez/xemu-uwp/releases/download/uwp-0.9.208.0/libsmb2-6.2-source.zip
  SDL3_HEADERS_REPO: XboxEmulationHub/SDL3-uwp # the fork README-UWP.md names, branch uwp-3.4.16
  SDL3_HEADERS_REF: ddd5d4f99a26ac95d4620ccf489c07fcf5f08636
  # Mesa DLLs with the DXBC backend: lopezjon45-web/mesa-uwp branch dxbc-port at 3f807f0, built by run
  # https://github.com/lopezjon45-web/mesa-uwp/actions/runs/39344416321 (artifact mesa-uwp-one-s, id 12230287197,
  # gate reports from artifact uwp-gate-report), published as release one-s-dxbc-3f807f0 of that repository.
  MESA_RELEASE_URL: https://github.com/lopezjon45-web/mesa-uwp/releases/download/one-s-dxbc-3f807f0
  MESA_WGL_SHA256: 21fc7fc397e941b0edd38bc82175090826990e68407113309cd27eecf6c9f6fb
  MESA_GL32_SHA256: 92e4e23e49021f47fcb548d8b37a4ad5b49d2179131050e217633009f1b5099c
  PKG_VERSION: 0.9.227.1

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # scripts/xemu-version.sh runs `git describe --tags --match 'v*'` for the version string, and the fork this
      # branch lives in has no tags. Fetch them, read-only, from the repository the branch starts from.
      - name: Tags for the version string
        run: |
          git fetch --tags --no-recurse-submodules https://github.com/skitzellez/xemu-uwp.git
          git describe --tags --match 'v*'

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git make unzip diffutils
          pacboy: >-
            toolchain:p pkgconf:p ninja:p meson:p cmake:p python:p ccache:p tools-git:p
            glib2:p pixman:p libepoxy:p libslirp:p libsamplerate:p openssl:p curl:p zlib:p zstd:p
            glslang:p spirv-tools:p vulkan-headers:p libmspack:p xxhash:p nlohmann-json:p python-yaml:p

      - name: Original package
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri $env:APPX_URL -OutFile orig.appx
          $hash = (Get-FileHash orig.appx -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:APPX_SHA256) { throw "orig.appx has SHA-256 $hash, expected $env:APPX_SHA256" }
          makeappx unpack /o /d orig /p orig.appx
          if ($LASTEXITCODE -ne 0) { throw "makeappx unpack failed" }
          Invoke-WebRequest -Uri $env:LIBSMB2_SRC_URL -OutFile libsmb2-src.zip

      - name: Compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ccache
          key: ccache-uwp-one-s-${{ github.sha }}
          restore-keys: ccache-uwp-one-s-

      - name: Import libraries and headers for SDL3.dll and smb2.dll
        shell: msys2 {0}
        run: .github/uwp-one-s/prepare-deps.sh orig libsmb2-src.zip report

      # Meson runs scripts/xemu-version.sh through its shebang as the bare command `bash`, from the build's native
      # Python, and CreateProcess searches System32 before PATH. windows-latest ships WSL's
      # C:\Windows\System32\bash.exe with no distribution installed; it exits 1 with its message on stdout only, so
      # the build stopped at xemu-version-macro.h with an empty stderr. Remove that launcher from the runner, and
      # MSYS2's /usr/bin/bash is the only bash left.
      - name: Remove WSL's bash.exe from System32
        shell: pwsh
        run: |
          $wsl = "$env:SystemRoot\System32\bash.exe"
          if (Test-Path $wsl) {
            takeown /f $wsl | Out-Null
            icacls $wsl /grant "*S-1-5-32-544:F" | Out-Null
            Remove-Item $wsl
            Write-Output "removed $wsl"
          } else {
            Write-Output "no $wsl on this runner"
          }

      - name: Configure and build xemu.exe
        shell: msys2 {0}
        env:
          CCACHE_DIR: ${{ github.workspace }}/ccache
          AR: gcc-ar
          RANLIB: gcc-ranlib
          NM: gcc-nm
          # subprojects/dsp56300 runs MSYS2's tar on a D:/... path, which GNU tar reads as host:path without this
          TAR_OPTIONS: --force-local
        run: |
          python -c 'import subprocess, sys; r = subprocess.run(["bash", "-c", "echo $BASH"], capture_output=True, text=True); found = (r.stdout + r.stderr).strip(); print("the native Python resolves bash to", found or "nothing"); sys.exit(0 if r.returncode == 0 and found == "/usr/bin/bash" else "bash must be MSYS2 /usr/bin/bash: another bash.exe comes first in the CreateProcess search order")'
          export PKG_CONFIG_PATH="$(cd .. && pwd)/deps/sdl3-uwp/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          pkg-config --modversion sdl3
          gcc --version | head -1 | tee report/compiler.txt
          mkdir -p build-uwp && cd build-uwp
          ../configure --cc='ccache gcc' --cxx='ccache g++' \
            --extra-cflags='-DXBOX=1 -DXEMU_UWP=1 -Wno-error -lIphlpapi -lCrypt32 -march=btver2 -mtune=btver2 -mprefer-vector-width=128' \
            --target-list=i386-softmmu -Db_lto=true -Dx86_version=2
          make -j"$(nproc)" qemu-system-i386w.exe
          ccache -s

      # Saved even when a later step fails, so the next run does not compile xemu from scratch.
      - name: Save the compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ccache
          key: ccache-uwp-one-s-${{ github.sha }}

      - name: Gate on instructions the One S cannot run
        shell: msys2 {0}
        run: .github/uwp-one-s/isa-gate.sh objdump build-uwp/qemu-system-i386w.exe | tee report/gate.txt

      - name: Assemble the package folder
        shell: msys2 {0}
        run: .github/uwp-one-s/assemble-package.sh orig pkg build-uwp/qemu-system-i386w.exe "$PKG_VERSION" report

      # The two Mesa DLLs come from the DXBC build, pinned by SHA-256. Their ISA gate reports (the mesa-uwp
      # gate, which names the AVX2 sites the CRT and Mesa reach only behind __isa_available checks) must end in
      # "failing 0". The PDBs ride along in the artifact for reading the console's crash dumps.
      - name: Mesa DLLs with the DXBC backend
        shell: msys2 {0}
        run: |
          mkdir -p mesa
          for f in libgallium_wgl.dll opengl32.dll libgallium_wgl.pdb opengl32.pdb gate-libgallium_wgl.dll.txt gate-opengl32.dll.txt; do
            curl -sfL -o "mesa/$f" "$MESA_RELEASE_URL/$f"
          done
          printf '%s  mesa/libgallium_wgl.dll\n%s  mesa/opengl32.dll\n' "$MESA_WGL_SHA256" "$MESA_GL32_SHA256" | sha256sum -c -
          for d in libgallium_wgl.dll opengl32.dll; do
            tr -d '\r' < "mesa/gate-$d.txt" > "report/gate-$d.txt"
            grep -qx 'failing 0' "report/gate-$d.txt" || { echo "the Mesa gate report for $d does not say failing 0" >&2; exit 1; }
            grep -qx 'BMI2 0' "report/gate-$d.txt" && grep -qx 'FMA3 0' "report/gate-$d.txt" || { echo "$d carries BMI2 or FMA3" >&2; exit 1; }
            cp "mesa/$d" "pkg/$d"
            sed -i "s/^$d\toriginal\$/$d\tdxbc/" report/dlls.tsv
            awk -F'\t' -v d="$d" '$1 == d && $2 == "dxbc" { ok = 1 } END { exit !ok }' report/dlls.tsv || { echo "$d not marked dxbc in dlls.tsv" >&2; exit 1; }
          done
          cp mesa/libgallium_wgl.pdb mesa/opengl32.pdb report/
          sha256sum pkg/libgallium_wgl.dll pkg/opengl32.dll | tee report/mesa.sha256

      - name: Mark, pack and sign
        shell: pwsh
        run: |
          editbin /NOLOGO /APPCONTAINER pkg\xemu.exe
          if ($LASTEXITCODE -ne 0) { throw "editbin failed" }
          New-Item -ItemType Directory -Force out | Out-Null
          $appx = "out\Xemu_${env:PKG_VERSION}_x64.appx"
          makeappx pack /o /d pkg /p $appx
          if ($LASTEXITCODE -ne 0) { throw "makeappx pack failed" }
          # A throwaway certificate with the package's publisher as subject. This build is for one console in
          # Dev Mode, which accepts any signature; the key is deleted below and never leaves the runner.
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=GamerDad" -KeyUsage DigitalSignature `
            -KeyAlgorithm RSA -KeyLength 2048 -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}") -NotAfter (Get-Date).AddYears(10)
          $password = [guid]::NewGuid().ToString()
          Export-PfxCertificate -Cert $cert -FilePath sign.pfx -Password (ConvertTo-SecureString $password -AsPlainText -Force) | Out-Null
          signtool sign /fd SHA256 /f sign.pfx /p $password $appx
          $signed = $LASTEXITCODE
          Remove-Item sign.pfx
          Remove-Item $cert.PSPath
          if ($signed -ne 0) { throw "signtool failed" }

      - name: Build report
        shell: msys2 {0}
        run: |
          appx=out/Xemu_${PKG_VERSION}_x64.appx
          sha256sum "$appx" | tee report/appx.sha256
          {
            echo "# xemu for Xbox One S, package $PKG_VERSION"
            echo
            echo "- start commit: $START_COMMIT (skitzellez/xemu-uwp, branch uwp)"
            echo "- built commit: $GITHUB_SHA (branch $GITHUB_REF_NAME), run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- original package: $APPX_URL (SHA-256 $APPX_SHA256)"
            echo "- $(cat report/sdl3.txt)"
            echo "- compiler: $(cat report/compiler.txt)"
            echo "- configure: -Dx86_version=2 -Db_lto=true, extra cflags -march=btver2 -mtune=btver2 -mprefer-vector-width=128"
            echo "- appx SHA-256: $(cut -d' ' -f1 report/appx.sha256)"
            echo "- Mesa: DXBC build $MESA_RELEASE_URL (dxbc-port 3f807f0, run 39344416321); $(awk '{ printf "%s %s; ", $2, $1 }' report/mesa.sha256)"
            echo
            echo "## Instruction gate on xemu.exe (objdump)"
            echo
            sed 's/^/    /' report/gate.txt
            echo
            echo "## Instruction gate on the Mesa DLLs (mesa-uwp one-s gate, summary lines)"
            echo
            for d in libgallium_wgl.dll opengl32.dll; do
              echo "    $d"
              grep -E '^(instructions|BMI2|FMA3|FMA4|AVX2|AVX512|allowed|failing) ' "report/gate-$d.txt" | sed 's/^/        /'
            done
            echo
            echo "## DLLs"
            echo
            echo "original: kept from the released package; rebuilt: replaced by this runner's MSYS2 build of the same library; added: new dependency from this runner; dropped: in the original, not needed by the new exe; dxbc: Mesa from the DXBC build named above."
            echo
            echo '| dll | origin |'
            echo '| --- | --- |'
            tail -n +2 report/dlls.tsv | awk -F'\t' '{ printf "| %s | %s |\n", $1, $2 }'
          } > out/build-report.md
          cp report/gate.txt report/dlls.tsv report/gate-*.txt report/mesa.sha256 report/*.pdb out/
          cat out/build-report.md

      - uses: actions/upload-artifact@v4
        with:
          name: xemu-one-s-${{ env.PKG_VERSION }}
          path: out
          compression-level: 0
          if-no-files-found: error
